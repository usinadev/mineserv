# Propriedades do Servidor Minecraft
# Estas configurações podem ser modificadas conforme necessário

# Configurações Básicas
server-name=Minecraft Server
server-port=25565
online-mode=false
max-players=20
difficulty=normal
gamemode=survival
hardcore=false
allow-flight=false
pvp=true

# Configurações de Mundo
level-name=world
level-seed=
level-type=minecraft:normal
generate-structures=true
spawn-protection=0
max-world-size=29999984

# Configurações de Rede
server-ip=
network-compression-threshold=256
max-tick-time=60000
rate-limit=0
view-distance=10
simulation-distance=10

# Configurações de Gameplay
motd=Bem-vindo ao servidor Minecraft!
force-gamemode=false
allow-nether=true
spawn-monsters=true
spawn-animals=true
spawn-npcs=true
spawn-protection=0

# Configurações de Whitelist/OP
white-list=false
enforce-whitelist=false
enable-query=false
enable-rcon=true
rcon.port=25575
rcon.password=changeme
broadcast-rcon-to-ops=true
op-permission-level=4

# Configurações de Resource Packs
resource-pack=
resource-pack-sha1=
require-resource-pack=false
resource-pack-prompt=

# Configurações de Player
player-idle-timeout=0

# Configurações de Debug
debug=false
enable-command-block=true
log-ips=true
hide-online-players=false
